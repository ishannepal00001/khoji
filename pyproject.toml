[project]
name = "khoji"
version = "0.1.0"
description = "Stealth Playwright scraping with Pydantic-typed extraction"
readme = "README.md"
authors = [
    { name = "ishannepal00001", email = "ishannepal00001@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "patchright>=1.63.0",
    "pydantic>=2",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
